plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv("ISLAM_RELEASE_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ISLAM_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("ISLAM_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ISLAM_RELEASE_KEY_PASSWORD")

android {
    namespace 'com.islamlab.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.islamlab.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
