plugins {
    id 'com.android.application'
}

android {
    namespace 'com.islamlab.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.islamlab.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // Uses Android's automatically generated debug key so CI needs no
            // private signing secrets. This is suitable for a one-time direct
            // install, but not a durable signing identity for future updates.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
