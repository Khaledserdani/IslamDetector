plugins {
    id 'com.android.application'
}

android {
    namespace 'com.islamlab.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.islamlab.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.2.0'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildTypes {
        release {
            // Temporary candidate signing only. This runner-generated debug key is not
            // a durable release identity. Final publication must use a stable
            // owner-controlled keystore and must pass the release gates.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
