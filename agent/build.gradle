plugins {
    id 'com.android.application'
}

android {
    namespace 'com.islamfreeagent.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.islamfreeagent.app'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
