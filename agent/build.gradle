plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.islamfreeagent.app'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.islamfreeagent.app'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '0.5.0'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.withType(Test).configureEach {
    // Robolectric's default repo1.maven.org endpoint is unreliable on some hosted runners.
    // Use Maven Central's canonical hostname for Android SDK test artifacts.
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    testLogging {
        events "failed"
        exceptionFormat "full"
        showCauses true
        showStackTraces true
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
