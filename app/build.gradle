plugins {
    id 'com.android.application'
}

android {
    namespace 'com.islamdetector.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.islamdetector.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}