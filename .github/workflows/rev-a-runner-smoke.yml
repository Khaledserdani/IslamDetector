name: Rev A hosted runner smoke
on:
  push:
    branches:
      - hardware/rev-a-measurement-design
permissions:
  contents: read
jobs:
  runner-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Confirm hosted runner startup
        shell: bash
        run: |
          set -euo pipefail
          echo "Islam Detector Rev A hosted-runner smoke test"
          uname -a
          printf 'runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'sha=%s\n' "${GITHUB_SHA}"
