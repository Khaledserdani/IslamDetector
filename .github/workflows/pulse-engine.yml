name: ISLAM LAB coupled PI pulse engine verification
on:
  push:
    branches: [ feature/islam-lab-foundation ]
    paths:
      - '.github/workflows/pulse-engine.yml'
      - 'simulation/dd3d/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/pulse-engine.yml'
      - 'simulation/dd3d/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: islam-lab-pulse-engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Verify 3D filament kernel
        working-directory: simulation/dd3d
        run: python -m unittest -v test_filament_model.py
      - name: Verify coupled PI pulse engine
        working-directory: simulation/dd3d
        run: python -m unittest -v test_pulse_engine.py
      - name: Compare turn-off clamp scenarios
        working-directory: simulation/dd3d
        run: |
          python pulse_clamp_sweep.py --input sample_pulse_config.json --output ../../artifacts/dd3d-pulse-reference/clamp_sweep.csv
      - name: Run synthetic pulse-engine reference case
        working-directory: simulation/dd3d
        run: |
          python pulse_engine.py sample_pulse_config.json --output-dir ../../artifacts/dd3d-pulse-reference
          python verify_pulse_engine_output.py ../../artifacts/dd3d-pulse-reference
      - name: Run RX and AFE transient model
        working-directory: simulation/dd3d
        run: |
          python -m unittest -v test_afe_engine.py
          python afe_engine.py ../../artifacts/dd3d-pulse-reference/pulse_waveform.csv sample_afe_config.json --output-dir ../../artifacts/dd3d-pulse-reference/afe
          python verify_afe_output.py ../../artifacts/dd3d-pulse-reference/afe
      - name: Install ngspice for independent linear cross-check
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
      - name: Cross-check linear RX and AFE against ngspice
        working-directory: simulation/dd3d
        run: |
          python afe_spice_crosscheck.py ../../artifacts/dd3d-pulse-reference/pulse_waveform.csv sample_afe_config.json --output-dir ../../artifacts/dd3d-pulse-reference/spice
      - name: Archive pulse-engine reference waveform
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-PI-pulse-engine-reference
          path: artifacts/dd3d-pulse-reference/
          if-no-files-found: error
          retention-days: 30
