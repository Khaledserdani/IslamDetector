name: ISLAM FREE AGENT Android

on:
  push:
    branches:
      - feature/islam-free-agent-foundation
    paths:
      - 'agent/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/islam-free-agent-android.yml'
  pull_request:
    branches:
      - feature/islam-lab-searchcoil-redesign
    paths:
      - 'agent/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/islam-free-agent-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: islam-free-agent-android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build APK
        run: gradle --no-daemon :agent:testDebugUnitTest :agent:assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=agent/build/outputs/apk/debug/agent-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.islamfreeagent.app'"
          sha256sum "$APK"
      - name: Upload ISLAM FREE AGENT APK
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-FREE-AGENT-Android-APK
          path: agent/build/outputs/apk/debug/agent-debug.apk
          retention-days: 30
