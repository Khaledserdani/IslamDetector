name: ISLAM Actions Dependency Probe
# Diagnostic only: isolate checkout action.

on:
  push:
    branches:
      - feature/islam-free-agent-foundation
  pull_request:
    branches:
      - feature/islam-lab-searchcoil-redesign
    paths:
      - '.github/workflows/agent-actions-dependency-probe.yml'

permissions:
  contents: read

jobs:
  checkout-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout action
        uses: actions/checkout@v4
      - name: Confirm checkout action completed
        run: echo "checkout completed"
