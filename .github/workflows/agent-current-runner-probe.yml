name: ISLAM Current Runner Health Probe

on:
  push:
    branches:
      - feature/islam-free-agent-foundation
  pull_request:
    branches:
      - feature/islam-lab-searchcoil-redesign
    paths:
      - '.github/workflows/agent-current-runner-probe.yml'

permissions:
  contents: read

jobs:
