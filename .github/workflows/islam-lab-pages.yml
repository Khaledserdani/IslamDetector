name: Deploy ISLAM LAB PWA
on:
  push:
    branches:
      - lab/islam-spice-platform-foundation
    paths:
      - "lab/web/**"
      - ".github/workflows/islam-lab-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: islam-lab-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check lab/web/app.js
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R lab/web/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
