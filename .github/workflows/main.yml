name: Validate Islam Detector app and Rev A firmware
on:
  # PR synchronization is the single automatic trigger; workflow_dispatch remains available.
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/main.yml'
      - '.github/actions/**'
      - 'tools/**'
      - 'firmware/rp2040_timing_test/**'
      - 'firmware/esp32_s3_bridge/**'
      - 'app/**'
      - 'pro/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rev-a-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository without third-party actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Test Rev A telemetry protocol
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Build and test portable ESP32-S3 protocol decoder
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/esp32_s3_bridge/components/rev_a_protocol/include \
            firmware/esp32_s3_bridge/components/rev_a_protocol/rev_a_protocol.c \
            firmware/esp32_s3_bridge/components/rev_a_protocol/rev_a_session.c \
            firmware/esp32_s3_bridge/tests/test_rev_a_protocol.c \
            -o /tmp/rev_a_protocol_test
          /tmp/rev_a_protocol_test

      - name: Test safe HTTP command policy
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ifirmware/esp32_s3_bridge/main \
            firmware/esp32_s3_bridge/main/rev_a_http_api_policy.c \
            firmware/esp32_s3_bridge/tests/test_rev_a_http_api_policy.c \
            -o /tmp/rev_a_http_api_policy_test
          /tmp/rev_a_http_api_policy_test

  rp2040-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository without third-party actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install RP2040 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Checkout Raspberry Pi Pico SDK 2.3.1
        run: |
          git clone --depth 1 --branch 2.3.1 \
            https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1 lib/tinyusb

      - name: Build RP2040 logic timing firmware
        run: |
          cmake -S firmware/rp2040_timing_test -B build/rp2040 \
            -DPICO_SDK_PATH="$RUNNER_TEMP/pico-sdk" \
            -DPICO_BOARD=waveshare_rp2040_zero
          cmake --build build/rp2040 --parallel 2

      - name: Verify RP2040 UF2 structure and family ID
        run: |
          set -euo pipefail
          python3 tools/verify_uf2.py build/rp2040/islam_rev_a_timing_test.uf2 --family-id 0xE48BFF56
          sha256sum build/rp2040/islam_rev_a_timing_test.uf2

      - name: Install pinned local artifact uploader dependency
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock --prefix .github/actions/upload-artifact

      - name: Upload RP2040 timing firmware
        uses: ./.github/actions/upload-artifact
        with:
          name: IslamDetector-RevA-RP2040-Timing-Test-UF2
          path: build/rp2040/islam_rev_a_timing_test.uf2
          retention_days: "30"

  android-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository without third-party actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Select Java 17
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_17_X64:-}" && -x "$JAVA_HOME_17_X64/bin/java" ]]; then
            JAVA_HOME="$JAVA_HOME_17_X64"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openjdk-17-jdk
            JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME/bin/java" -version

      - name: Install checksum-verified Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.9
          ZIP="$RUNNER_TEMP/gradle-$VERSION-bin.zip"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip" -o "$ZIP"
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  $ZIP" | sha256sum --check
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$VERSION/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-$VERSION/bin/gradle" --version

      - name: Build original Android app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/android-gradle-${attempt}.log"
            if gradle --no-daemon --max-workers=1 clean :app:assembleDebug 2>&1 | tee "$log_file"; then
              exit 0
            fi
            if ! grep -Eqi 'status code 429|HTTP 429|Too Many Requests' "$log_file"; then
              echo "Gradle failed for a non-rate-limit reason; not retrying." >&2
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Maven Central returned HTTP 429 after three attempts." >&2
              exit 1
            fi
            delay_seconds=$((attempt * 30))
            echo "Maven Central rate limit detected; retrying in ${delay_seconds}s. Gradle's partial dependency cache will be reused."
            sleep "$delay_seconds"
          done

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 20000
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Install pinned local artifact uploader dependency
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock --prefix .github/actions/upload-artifact

      - name: Upload original app
        uses: ./.github/actions/upload-artifact
        with:
          name: IslamDetector-Original-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention_days: "30"

  esp32-s3-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository without third-party actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Select ESP32-S3 target and build in official ESP-IDF release-v5.4 container
        shell: bash
        run: |
          set -euo pipefail
          docker pull espressif/idf:release-v5.4
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project/firmware/esp32_s3_bridge \
            espressif/idf:release-v5.4 \
            sh -c 'idf.py set-target esp32s3 && idf.py build'

          ESP32_DIR="firmware/esp32_s3_bridge"
          grep -Fxq 'CONFIG_IDF_TARGET="esp32s3"' "$ESP32_DIR/sdkconfig"
          grep -Fxq 'CONFIG_IDF_TARGET_ESP32S3=y' "$ESP32_DIR/sdkconfig"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project/firmware/esp32_s3_bridge \
            espressif/idf:release-v5.4 \
            python -m esptool --chip esp32s3 image_info build/islam_detector_rev_a_bridge.bin
          test -s "$ESP32_DIR/build/islam_detector_rev_a_bridge.bin"
          test -s "$ESP32_DIR/build/bootloader/bootloader.bin"
          test -s "$ESP32_DIR/build/partition_table/partition-table.bin"

          cat > "$ESP32_DIR/build/BUILD-ONLY-NOT-FOR-FLASH.txt" <<EOF
          target=esp32s3
          esp_idf=release-v5.4
          source_commit=$GITHUB_SHA
          uart_enabled_default=no
          wifi_enabled_default=no
          hardware_validation=not_performed
          status=build_only_not_for_flashing
          EOF

          sha256sum \
            "$ESP32_DIR/build/islam_detector_rev_a_bridge.bin" \
            "$ESP32_DIR/build/bootloader/bootloader.bin" \
            "$ESP32_DIR/build/partition_table/partition-table.bin"

          tar -czf "$ESP32_DIR/build/IslamDetector-RevA-ESP32S3-BUILD-ONLY.tar.gz" \
            -C "$ESP32_DIR/build" \
            islam_detector_rev_a_bridge.bin \
            bootloader/bootloader.bin \
            partition_table/partition-table.bin \
            flash_args \
            BUILD-ONLY-NOT-FOR-FLASH.txt
          sha256sum "$ESP32_DIR/build/IslamDetector-RevA-ESP32S3-BUILD-ONLY.tar.gz"

      - name: Install pinned local artifact uploader dependency
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock --prefix .github/actions/upload-artifact

      - name: Upload ESP32-S3 build-only bundle
        uses: ./.github/actions/upload-artifact
        with:
          name: IslamDetector-RevA-ESP32S3-BUILD-ONLY
          path: firmware/esp32_s3_bridge/build/IslamDetector-RevA-ESP32S3-BUILD-ONLY.tar.gz
          retention_days: "30"
