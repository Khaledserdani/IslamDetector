name: Validate Islam Detector app and Rev A firmware
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test Rev A telemetry protocol
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Checkout Raspberry Pi Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          path: pico-sdk
          submodules: recursive
      - name: Install ARM embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build RP2040 logic timing firmware
        run: |
          cmake -S firmware/rp2040_timing_test -B build/rp2040 \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DPICO_BOARD=pico
          cmake --build build/rp2040 --parallel 2
      - name: Verify RP2040 UF2
        run: |
          test -f build/rp2040/islam_rev_a_timing_test.uf2
          test "$(stat -c%s build/rp2040/islam_rev_a_timing_test.uf2)" -gt 1000
      - name: Build original Android app
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 20000
          unzip -t "$APK"
          sha256sum "$APK"
      - name: Upload RP2040 timing firmware
        uses: actions/upload-artifact@v4
        with:
          name: IslamDetector-RevA-RP2040-Timing-Test-UF2
          path: build/rp2040/islam_rev_a_timing_test.uf2
          retention-days: 30
      - name: Upload original app
        uses: actions/upload-artifact@v4
        with:
          name: IslamDetector-Original-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
