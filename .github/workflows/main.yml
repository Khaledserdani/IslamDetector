name: Build and test ISLAM LAB Android app
on:
  push:
    branches: [ feature/islam-lab-foundation ]
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/main.yml'
      - 'app/**'
      - 'lab/**'
      - 'simulation/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle/**'
permissions:
  contents: read
concurrency:
  group: islam-lab-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  android-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install scientific simulation engines
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:elmer-csc-ubuntu/elmer-csc-ppa
          sudo apt-get update
          sudo apt-get install -y ngspice elmerfem-csc
      - name: Run analytical ngspice RLC reference
        shell: bash
        run: |
          set -euo pipefail
          ngspice -b -o /tmp/islam-rlc.log simulation/ngspice/series_rlc_step.cir
          python3 simulation/ngspice/verify_series_rlc.py /tmp/islam-rlc.log
      - name: Run pinned Elmer two-coil MagnetoDynamics reference
        shell: bash
        run: |
          set -euo pipefail
          bash simulation/elmer/run_upstream_two_coil_reference.sh
      - name: Build Android applications
        run: gradle --no-daemon clean :lab:testDebugUnitTest :lab:assembleDebug
      - name: Verify APK packages
        shell: bash
        run: |
          set -euo pipefail
          APK=lab/build/outputs/apk/debug/lab-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 1000
          unzip -t "$APK"
          sha256sum "$APK"
      - name: Upload ISLAM LAB APK
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Android-APK
          path: lab/build/outputs/apk/debug/lab-debug.apk
          retention-days: 30
