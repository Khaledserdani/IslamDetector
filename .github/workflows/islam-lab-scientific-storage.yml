name: ISLAM LAB scientific storage tests

on:
  push:
    branches:
      - feature/islam-lab-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-unit-tests:
    name: Lab unit tests (including Robolectric SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run ISLAM LAB unit tests
        run: gradle :lab:testDebugUnitTest --no-daemon --stacktrace
