name: Build signed ISLAM LAB release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: islam-lab-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate release signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ISLAM_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ISLAM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ISLAM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ISLAM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing ISLAM_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing ISLAM_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ISLAM_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ISLAM_RELEASE_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/islam-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/islam-signing/release.jks"
          test -s "$RUNNER_TEMP/islam-signing/release.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build signed release APK
        env:
          ISLAM_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/islam-signing/release.jks
          ISLAM_RELEASE_STORE_PASSWORD: ${{ secrets.ISLAM_RELEASE_STORE_PASSWORD }}
          ISLAM_RELEASE_KEY_ALIAS: ${{ secrets.ISLAM_RELEASE_KEY_ALIAS }}
          ISLAM_RELEASE_KEY_PASSWORD: ${{ secrets.ISLAM_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon clean :lab:testDebugUnitTest :lab:assembleRelease

      - name: Verify APK and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=lab/build/outputs/apk/release/lab-release.apk
          test -s "$APK"
          unzip -t "$APK"
          SDK=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$SDK/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Publish final installable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: islam-lab-v1.0.0
          name: ISLAM LAB v1.0.0
          prerelease: false
          generate_release_notes: true
          files: lab/build/outputs/apk/release/lab-release.apk
