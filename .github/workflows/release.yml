name: Validate ISLAM LAB release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: islam-lab-release-candidate
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build release candidate APK
        run: gradle --no-daemon clean :lab:testDebugUnitTest :lab:assembleRelease

      - name: Verify candidate APK and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=lab/build/outputs/apk/release/lab-release.apk
          test -s "$APK"
          unzip -t "$APK"
          SDK=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$SDK/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload release candidate for internal validation
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Release-Candidate
          path: lab/build/outputs/apk/release/lab-release.apk
          retention-days: 14
