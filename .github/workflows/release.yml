name: Build signed ISLAM DETECTOR and ISLAM LAB release APKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: islam-android-release
  cancel-in-progress: false

jobs:
  release-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare the project-owned signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "::error::Missing ANDROID_STORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/islam-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/islam-signing/islam-release.jks"
          test -s "$RUNNER_TEMP/islam-signing/islam-release.jks"

      - name: Run tests and build both signed release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/islam-signing/islam-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean \
            :app:testDebugUnitTest :lab:testDebugUnitTest \
            :app:assembleRelease :lab:assembleRelease

      - name: Verify package IDs, signatures, and checksums
        shell: bash
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/release/app-release.apk
          LAB_APK=lab/build/outputs/apk/release/lab-release.apk
          test -s "$APP_APK"
          test -s "$LAB_APK"
          unzip -t "$APP_APK"
          unzip -t "$LAB_APK"
          SDK=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$SDK/aapt" dump badging "$APP_APK" | grep -F "package: name='com.islamdetector.app'"
          "$SDK/aapt" dump badging "$LAB_APK" | grep -F "package: name='com.islamlab.app'"
          "$SDK/apksigner" verify --verbose --print-certs "$APP_APK" > app-signature.txt
          "$SDK/apksigner" verify --verbose --print-certs "$LAB_APK" > lab-signature.txt
          APP_CERT=$(grep 'Signer #1 certificate SHA-256 digest:' app-signature.txt | head -n1 | awk '{print $NF}')
          LAB_CERT=$(grep 'Signer #1 certificate SHA-256 digest:' lab-signature.txt | head -n1 | awk '{print $NF}')
          test -n "$APP_CERT"
          test "$APP_CERT" = "$LAB_CERT"
          sha256sum "$APP_APK" "$LAB_APK" | tee APK-SHA256SUMS.txt
          printf 'Signing certificate SHA-256: %s\n' "$APP_CERT" | tee -a APK-SHA256SUMS.txt

      - name: Upload ISLAM DETECTOR final-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-DETECTOR-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload ISLAM LAB final-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Release-APK
          path: lab/build/outputs/apk/release/lab-release.apk
          retention-days: 30

      - name: Upload release verification checksums
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-Android-Release-Verification
          path: APK-SHA256SUMS.txt
          retention-days: 30
