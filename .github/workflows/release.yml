name: Build ISLAM LAB release APK

on:
  push:
    branches:
      - feature/islam-lab-foundation
    paths:
      - '.github/workflows/release.yml'
      - 'lab/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: islam-lab-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build installable release APK
        run: gradle --no-daemon clean :lab:testDebugUnitTest :lab:assembleRelease

      - name: Verify APK and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=lab/build/outputs/apk/release/lab-release.apk
          test -s "$APK"
          unzip -t "$APK"
          SDK=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$SDK/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Publish installable APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: islam-lab-v1.0.0
          name: ISLAM LAB v1.0.0
          prerelease: false
          generate_release_notes: true
          files: lab/build/outputs/apk/release/lab-release.apk
