name: ISLAM Pinned Actions Probe

on:
  push:
    branches:
      - feature/islam-free-agent-foundation
  pull_request:
    branches:
      - feature/islam-lab-searchcoil-redesign
    paths:
      - '.github/workflows/agent-pinned-actions-probe.yml'

permissions:
  contents: read

jobs:
  pinned-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout pinned to verified v4 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python pinned to verified v5 commit
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify Python
        run: python --version
