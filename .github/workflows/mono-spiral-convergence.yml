name: ISLAM LAB Mono Spiral disk surrogate convergence

on:
  push:
    branches:
      - feature/islam-lab-searchcoil-redesign
    paths:
      - "simulation/spiral/**"
      - ".github/workflows/mono-spiral-convergence.yml"
  pull_request:
    paths:
      - "simulation/spiral/**"
      - ".github/workflows/mono-spiral-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch source using runner git (no external actions)
        env:
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 --no-tags --branch "$SOURCE_REF" "https://github.com/$SOURCE_REPOSITORY.git" source
          python3 --version
      - name: Run all unit tests
        working-directory: source/simulation/spiral
        run: python3 -m unittest -v
      - name: Run disk surrogate convergence sweep
        working-directory: source/simulation/spiral
        run: python3 run_disk_convergence.py
      - name: Run disk surrogate time-step sensitivity sweep
        working-directory: source/simulation/spiral
        run: python3 run_disk_timestep_sensitivity.py
      - name: Run synthetic target parameter sweep
        working-directory: source/simulation/spiral
        run: python3 run_disk_parameter_sweep.py
      - name: Run provisional coil-inductance sensitivity sweep
        working-directory: source/simulation/spiral
        run: python3 run_coil_inductance_sensitivity.py
      - name: Run Greenhouse path-specific inductance convergence
        working-directory: source/simulation/spiral
        run: python3 run_greenhouse_inductance.py
      - name: Summarize generated CSV outputs
        working-directory: source/simulation/spiral
        run: |
          set -euo pipefail
          for file in disk_surrogate_convergence_corrected.csv disk_surrogate_timestep_sensitivity.csv disk_surrogate_parameter_sweep.csv disk_surrogate_coil_inductance_sensitivity.csv greenhouse_inductance_convergence.csv; do
            test -s "$file"
            echo "Generated $file ($(wc -l < "$file") lines)"
            head -n 3 "$file"
          done
