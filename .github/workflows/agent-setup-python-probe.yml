name: ISLAM Setup Python Action Probe
# Temporary diagnostic: isolate setup-python from checkout.

on:
  push:
    branches:
      - feature/islam-free-agent-foundation
  pull_request:
    branches:
      - feature/islam-lab-searchcoil-redesign
    paths:
      - '.github/workflows/agent-setup-python-probe.yml'

permissions:
  contents: read

jobs:
  setup-python-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Setup Python action
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm Python
        run: python --version
