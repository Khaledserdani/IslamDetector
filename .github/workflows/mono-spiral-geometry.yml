name: ISLAM LAB Mono Spiral geometry tests

on:
  push:
    branches:
      - feature/islam-lab-searchcoil-redesign
    paths:
      - "simulation/spiral/**"
      - ".github/workflows/mono-spiral-geometry.yml"
  pull_request:
    paths:
      - "simulation/spiral/**"
      - ".github/workflows/mono-spiral-geometry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run geometry unit tests
        working-directory: simulation/spiral
        run: python -m unittest -v
