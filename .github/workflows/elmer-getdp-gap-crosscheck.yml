name: ISLAM LAB Elmer-GetDP matched PI gap cross-check
on:
  push:
    branches: [ feature/islam-lab-foundation ]
    paths:
      - '.github/workflows/elmer-getdp-gap-crosscheck.yml'
      - 'simulation/elmer/run_pi_pulse_foil_surrogate.sh'
      - 'simulation/elmer/run_pi_pulse_depth_sweep.sh'
      - 'simulation/elmer/pi_pulse_separate_coil.sif'
      - 'simulation/getdp/compare_getdp_elmer_gap_sweep.py'
      - 'simulation/getdp/results/getdp_pi_target_gap_sweep_2026-11-13.csv'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: islam-lab-elmer-getdp-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  matched-crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Elmer FEM and Gmsh
        run: |
          set -euo pipefail
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:elmer-csc-ubuntu/elmer-csc-ppa
          sudo apt-get update
          sudo apt-get install -y elmerfem-csc gmsh python3
      - name: Run Elmer with matched geometry, drive, mesh refinement and outer boundary
        run: |
          set -euo pipefail
          bash -n simulation/elmer/run_pi_pulse_foil_surrogate.sh
          bash -n simulation/elmer/run_pi_pulse_depth_sweep.sh
          python3 -m py_compile simulation/getdp/compare_getdp_elmer_gap_sweep.py
          bash simulation/getdp/run_elmer_matched_gap_crosscheck.sh
      - name: Upload compact cross-solver data and solver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Elmer-GetDP-matched-gap-crosscheck
          path: |
            artifacts/elmer-pi-depth-sweep/getdp_elmer_gap_crosscheck.csv
            artifacts/elmer-pi-depth-sweep/pi_target_gap_sweep_summary.csv
            artifacts/elmer-pi-depth-sweep/inputs/pi_pulse_getdp_outer_dirichlet.sif
            artifacts/elmer-pi-depth-sweep/gap-*/target_current_axisymmetric_summary.csv
            artifacts/elmer-pi-depth-sweep/gap-*/target_induced_current_summary.csv
            artifacts/elmer-pi-depth-sweep/gap-*/reference.txt
            artifacts/elmer-pi-depth-sweep/gap-*/elmersolver-pi-pulse.log
            artifacts/elmer-pi-depth-sweep/gap-*/islam-pi-pulse.sif
            artifacts/elmer-pi-depth-sweep/gap-*/pi_pulse_separate_coil.geo
          if-no-files-found: warn
          retention-days: 90
