name: ISLAM Agent Startup Probe

on:
  pull_request:
    branches:
      - feature/islam-lab-searchcoil-redesign
    paths:
      - '.github/workflows/agent-startup-probe.yml'

permissions:
  contents: read

jobs:
  startup-probe:
    name: Minimal runner startup check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner started
        run: echo "ISLAM agent startup probe reached a GitHub-hosted runner."
