name: Build ISLAM FREE AGENT APK

on:
  pull_request:
    branches:
      - feature/islam-free-agent-foundation
      - feature/islam-free-agent-github
      - feature/islam-free-agent-safe-write
      - feature/islam-free-agent-phone-only-v6
      - feature/islam-free-agent-task-execution
      - feature/islam-free-agent-task-execution-fix
      - feature/islam-free-agent-lab-integration
    paths:
      - 'agent/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/islam-free-agent-apk.yml'
  push:
    branches:
      - feature/islam-free-agent-foundation
      - feature/islam-free-agent-github
      - feature/islam-free-agent-safe-write
      - feature/islam-free-agent-phone-only-v6
      - feature/islam-free-agent-task-execution
      - feature/islam-free-agent-task-execution-fix
    paths:
      - 'agent/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/islam-free-agent-apk.yml'
  workflow_dispatch:

# Build and test jobs never need repository write access.
permissions:
  contents: read

concurrency:
  group: islam-free-agent-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-agent:
    name: Test, build and verify the standalone Android assistant
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch exact source commit
        env:
          SOURCE_REF: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init source
          cd source
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth 1 origin "$SOURCE_REF"
          git checkout --detach FETCH_HEAD

      - name: Prepare Java, Android SDK and Gradle
        working-directory: source
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          fi
          java -version
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
          GRADLE_VERSION=8.9
          curl -fsSLo /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          curl -fsSLo /tmp/gradle.zip.sha256 "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip.sha256"
          echo "$(cat /tmp/gradle.zip.sha256)  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
          /tmp/gradle-$GRADLE_VERSION/bin/gradle --version

      - name: Run Android tests and assemble debug APK
        working-directory: source
        run: |
          set -euo pipefail
          gradle --no-daemon :agent:testDebugUnitTest :agent:assembleDebug

      - name: Verify APK package, integrity and checksum
        id: verify
        working-directory: source
        run: |
          set -euo pipefail
          APK=agent/build/outputs/apk/debug/agent-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.islamfreeagent.app'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='0.5.0'"
          sha256sum "$APK" | tee agent-apk-sha256.txt
          echo "apk_sha256=$(cut -d' ' -f1 agent-apk-sha256.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK for review
        uses: actions/upload-artifact@v4
        with:
          name: islam-free-agent-v0.5.0-${{ github.run_number }}
          path: |
            source/agent/build/outputs/apk/debug/agent-debug.apk
            source/agent/agent-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write verification summary
        env:
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
        run: |
          {
            echo "## ISLAM FREE AGENT APK verification"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Package: com.islamfreeagent.app"
            echo "- Version: 0.5.0"
            echo "- SHA-256: $APK_SHA256"
            echo "- APK is available as a workflow artifact for review; no public release was created."
          } >> "$GITHUB_STEP_SUMMARY"
