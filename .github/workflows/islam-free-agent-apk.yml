name: Build ISLAM FREE AGENT APK

on:
  pull_request:
    branches:
      - feature/islam-free-agent-foundation
      - feature/islam-free-agent-github
      - feature/islam-free-agent-safe-write
      - feature/islam-free-agent-phone-only-v6
      - feature/islam-free-agent-task-execution
      - feature/islam-free-agent-task-execution-fix
    paths:
      - 'agent/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/islam-free-agent-apk.yml'
  push:
    branches:
      - feature/islam-free-agent-foundation
      - feature/islam-free-agent-github
      - feature/islam-free-agent-safe-write
      - feature/islam-free-agent-phone-only-v6
      - feature/islam-free-agent-task-execution
      - feature/islam-free-agent-task-execution-fix
    paths:
      - 'agent/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/islam-free-agent-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: islam-free-agent-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-agent:
    name: Test, build and verify the standalone Android assistant
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Run Android unit tests and assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --no-daemon --stacktrace :agent:testDebugUnitTest :agent:assembleDebug

      - name: Verify APK package, version, ZIP integrity and checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK=agent/build/outputs/apk/debug/agent-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.islamfreeagent.app'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='0.5.0'"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "$SHA256  $APK" | tee agent-apk-sha256.txt
          echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload verified APK for review
        uses: actions/upload-artifact@v4
        with:
          name: islam-free-agent-v0.5.0-${{ github.run_number }}
          path: |
            agent/build/outputs/apk/debug/agent-debug.apk
            agent-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Write verification summary
        env:
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
        shell: bash
        run: |
          {
            echo "## ISLAM FREE AGENT APK verification"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Package: com.islamfreeagent.app"
            echo "- Version: 0.5.0"
            echo "- SHA-256: $APK_SHA256"
            echo "- APK is available as a workflow artifact for review; no public release was created."
          } >> "$GITHUB_STEP_SUMMARY"
