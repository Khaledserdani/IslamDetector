name: Build ISLAM FREE AGENT APK

on:
  pull_request:
    branches:
      - feature/islam-free-agent-foundation
      - feature/islam-free-agent-github
      - feature/islam-free-agent-safe-write
      - feature/islam-free-agent-phone-only-v6
      - feature/islam-free-agent-task-execution
      - feature/islam-free-agent-task-execution-fix
    paths:
      - 'agent/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/islam-free-agent-apk.yml'
  push:
    branches:
      - feature/islam-free-agent-foundation
      - feature/islam-free-agent-github
      - feature/islam-free-agent-safe-write
      - feature/islam-free-agent-phone-only-v6
      - feature/islam-free-agent-task-execution
      - feature/islam-free-agent-task-execution-fix
    paths:
      - 'agent/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/islam-free-agent-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: islam-free-agent-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-agent:
    name: Test, build and verify the standalone Android assistant
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout exact source revision without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test -n "${PR_NUMBER}"
            git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
          test -f agent/build.gradle

      - name: Install and select Java 17 without external actions
        shell: bash
        run: |
          set -euo pipefail
          if ! java -version 2>&1 | grep -qE 'version "17([.]|")'; then
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk-headless
          fi
          JAVA_BIN="$(readlink -f "$(command -v javac)")"
          JAVA_HOME="$(dirname "$(dirname "$JAVA_BIN")")"
          test -x "$JAVA_HOME/bin/java"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME/bin/java" -version 2>&1 | tee java-version.txt
          "$JAVA_HOME/bin/java" -version 2>&1 | grep -E 'version "17([.]|")'

      - name: Install Gradle 8.9 without external GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.9
          curl --retry 4 --retry-all-errors --connect-timeout 20 -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Run Android unit tests and assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --no-daemon --stacktrace :agent:testDebugUnitTest :agent:assembleDebug

      - name: Verify APK package, version, ZIP integrity and checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK=agent/build/outputs/apk/debug/agent-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.islamfreeagent.app'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='0.5.0'"
          SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "$SHA256  $APK" | tee agent-apk-sha256.txt
          echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Write verification summary
        env:
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
          APK_SIZE: ${{ steps.verify.outputs.apk_size }}
        shell: bash
        run: |
          {
            echo "## ISLAM FREE AGENT APK verification"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Package: com.islamfreeagent.app"
            echo "- Version: 0.5.0"
            echo "- APK size: $APK_SIZE bytes"
            echo "- SHA-256: $APK_SHA256"
            echo "- Third-party GitHub Actions were not used; repository policy permits only owner-controlled actions."
            echo "- The APK was built and verified on the runner; artifact publication is intentionally not enabled until an owner-controlled upload path is configured."
          } >> "$GITHUB_STEP_SUMMARY"
