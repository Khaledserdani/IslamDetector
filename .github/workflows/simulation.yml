name: Scientific simulation references for ISLAM LAB
on:
  push:
    branches: [ feature/islam-lab-foundation ]
    paths:
      - '.github/workflows/simulation.yml'
      - 'simulation/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/simulation.yml'
      - 'simulation/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: islam-lab-simulation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  scientific-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check PI pulse source and winding dimensional consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 simulation/elmer/verify_pi_pulse_definition.py
      - name: Generate DD32 TX ideal RL design sweep
        shell: bash
        run: |
          set -euo pipefail
          python3 simulation/ngspice/generate_tx_rl_design_sweep.py
      - name: Archive DD32 TX analytic sweep
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-DD32-TX-analytic-sweep
          path: artifacts/dd32-tx-analytic-sweep/
          if-no-files-found: error
          retention-days: 30
      - name: Install scientific simulation engines
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:elmer-csc-ubuntu/elmer-csc-ppa
          sudo apt-get update
          sudo apt-get install -y ngspice elmerfem-csc gmsh
      - name: Run analytical ngspice RLC reference
        shell: bash
        run: |
          set -euo pipefail
          ngspice -b -o /tmp/islam-rlc.log simulation/ngspice/series_rlc_step.cir
          python3 simulation/ngspice/verify_series_rlc.py /tmp/islam-rlc.log
      - name: Run nominal DD32 TX coil RL decay reference
        shell: bash
        run: |
          set -euo pipefail
          ngspice -b -o /tmp/islam-txrl.log simulation/ngspice/tx_coil_rl_decay.cir
          python3 simulation/ngspice/verify_tx_rl_decay.py /tmp/islam-txrl.log
      - name: Run pinned Elmer two-coil MagnetoDynamics reference
        shell: bash
        run: |
          set -euo pipefail
          bash simulation/elmer/run_upstream_two_coil_reference.sh
      - name: Archive Elmer reference fields and logs
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Elmer-two-coil-reference
          path: artifacts/elmer-two-coil/
          if-no-files-found: error
          retention-days: 30
      - name: Run pinned Elmer transient conductive-foil reference
        shell: bash
        run: |
          set -euo pipefail
          bash simulation/elmer/run_upstream_transient_foil_reference.sh
      - name: Archive Elmer transient foil inputs and logs
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Elmer-transient-foil-reference
          path: artifacts/elmer-transient-foil/
          if-no-files-found: error
          retention-days: 30
      - name: Run Elmer zero-current PI baseline
        shell: bash
        run: |
          set -euo pipefail
          bash simulation/elmer/run_pi_zero_baseline.sh
      - name: Archive Elmer zero-current baseline
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Elmer-PI-zero-baseline
          path: artifacts/elmer-pi-zero-baseline/
          if-no-files-found: error
          retention-days: 30
      - name: Run Elmer normalized PI pulse surrogate
        shell: bash
        run: |
          set -euo pipefail
          bash simulation/elmer/run_pi_pulse_foil_surrogate.sh
      - name: Archive Elmer PI pulse surrogate fields
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Elmer-PI-pulse-surrogate
          path: artifacts/elmer-pi-pulse-surrogate/
          if-no-files-found: error
          retention-days: 30
      - name: Run matched Elmer PI no-target control
        shell: bash
        run: |
          set -euo pipefail
          bash simulation/elmer/run_pi_pulse_no_target_control.sh
      - name: Archive Elmer PI no-target control fields
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Elmer-PI-no-target-control
          path: artifacts/elmer-pi-no-target-control/
          if-no-files-found: error
          retention-days: 30

      - name: Run matched PI target-gap sweep
        shell: bash
        run: |
          set -euo pipefail
          bash simulation/elmer/run_pi_pulse_depth_sweep.sh
      - name: Archive PI target-gap sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Elmer-PI-target-gap-sweep
          path: artifacts/elmer-pi-depth-sweep/
          if-no-files-found: error
          retention-days: 30

      - name: Run controlled TX coil-radius sweep
        shell: bash
        run: |
          set -euo pipefail
          bash simulation/elmer/run_pi_coil_radius_sweep.sh
      - name: Archive controlled TX coil-radius sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Elmer-PI-coil-radius-sweep
          path: artifacts/elmer-coil-radius-sweep/
          if-no-files-found: error
          retention-days: 30

      - name: Run coin ring and large-target geometry sweep
        shell: bash
        run: |
          set -euo pipefail
          bash simulation/elmer/run_pi_target_geometry_sweep.sh
      - name: Archive target geometry comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Elmer-PI-target-geometry-sweep
          path: artifacts/elmer-target-geometry-sweep/
          if-no-files-found: error
          retention-days: 30
