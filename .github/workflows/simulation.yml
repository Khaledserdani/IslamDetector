name: Scientific simulation references for ISLAM LAB
on:
  push:
    branches: [ feature/islam-lab-foundation ]
    paths:
      - '.github/workflows/simulation.yml'
      - 'simulation/**'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/simulation.yml'
      - 'simulation/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: islam-lab-simulation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  scientific-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install scientific simulation engines
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:elmer-csc-ubuntu/elmer-csc-ppa
          sudo apt-get update
          sudo apt-get install -y ngspice elmerfem-csc
      - name: Run analytical ngspice RLC reference
        shell: bash
        run: |
          set -euo pipefail
          ngspice -b -o /tmp/islam-rlc.log simulation/ngspice/series_rlc_step.cir
          python3 simulation/ngspice/verify_series_rlc.py /tmp/islam-rlc.log
      - name: Run pinned Elmer two-coil MagnetoDynamics reference
        shell: bash
        run: |
          set -euo pipefail
          bash simulation/elmer/run_upstream_two_coil_reference.sh
      - name: Archive Elmer reference fields and logs
        uses: actions/upload-artifact@v4
        with:
          name: ISLAM-LAB-Elmer-two-coil-reference
          path: artifacts/elmer-two-coil/
          if-no-files-found: error
          retention-days: 30
